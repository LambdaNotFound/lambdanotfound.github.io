name: deploy

# Tests and builds the practice page, then publishes the whole site to
# GitHub Pages: index.html at the root, the page under /practice/.
# Needs Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# The Design tab's content is copied in at build time from the public
# system-design repository, so a design pushed there shows up at the next
# run: the daily one below, or "Run workflow" for one now.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *" # daily, 5:17 AM PST / 6:17 AM PDT
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish
  id-token: write # deploy-pages proves the run's identity with it

# One deployment at a time; a newer push waits rather than cancelling one
# that is halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice
    steps:
      - uses: actions/checkout@v7

      # Every design-doc/<slug>/rfc.md in here is bundled into the Design
      # tab (src/lib/designs.ts). The folder is git-ignored.
      - name: Check out the designs
        uses: actions/checkout@v7
        with:
          repository: LambdaNotFound/system-design
          path: practice/designs-src
          persist-credentials: false

      - name: Note which designs commit this build reads
        run: echo "VITE_DESIGNS_COMMIT=$(git -C designs-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: practice/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Assemble the site
        working-directory: .
        run: |
          mkdir _site
          cp index.html _site/
          cp -R practice/dist _site/practice

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}practice/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
